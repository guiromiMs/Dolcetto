<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Inicio de sesión</title>
         <link rel="stylesheet" href="estilos/estilos.css" >
         <script src="script/inicio.js" defer></script>
         <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    </head>
    <body class="pagina-login">

  <main class="pantalla-login">
    <section class="lado-formulario">
      <div class="caja-formulario">
        <div class="espacio-logo">
          <img src="imagenes/logo-dolcetto-md.svg" alt="Logo Dolcetto" class="logo-inicio" />
        </div>

        <h1>Iniciar sesión</h1>

        <form action="#" method="post">
          <div class="dol_campo">
            <label for="correo" class="etiqueta-oculta">Usuario</label>
            <input type="text" id="correo" name="correo" placeholder="Usuario" required/>
          </div>

          <div class="dol_campo">
            <label for="contrasena" class="etiqueta-oculta">Contraseña</label>
            <input type="password" id="contrasena" name="contrasena" placeholder="Contraseña" required/>
          </div>

          <button type="submit" class="btn-entrar">Iniciar sesión</button>
        </form>
      </div>
    </section>

    <aside class="lado-bienvenida">
      <div class="caja-bienvenida">
        <h2>¡Bienvenido!</h2>
        <p>Ingresa tus datos y comienza a gestionar tu día en Dolcetto.</p>
      </div>
    </aside>
  </main>
    </body>
</html>
